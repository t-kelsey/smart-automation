services:
  db:
    # Multi-arch (amd64 + arm64) fork of postgis/postgis, which only ships amd64 images.
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-api_dev}
    # Kept for local development (mix phx.server on the host); not needed by the other services.
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db/${POSTGRES_DB:-api_dev}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env (see .env.example)}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_PUBLIC_PORT: ${API_PORT:-4000}
      PHX_PUBLIC_SCHEME: http
      SEED_MOCK_DATA: ${SEED_MOCK_DATA:-false}
      MOCK_BOREHOLES: ${MOCK_BOREHOLES:-1000}
      # Where uploaded documents are sent for extraction, e.g. http://pipeline:8000/process
      # (needs `docker compose --profile bem up`). Empty: uploads are stored but not processed.
      PIPELINE_URL: ${PIPELINE_URL:-}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      # Source documents of the boreholes (confidential, never baked into the image)
      - document_storage:/data/storage

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"

  # --- BEM extraction pipeline (profile "bem", not started by a plain `docker compose up`) ---
  # Run it with:
  #   docker compose run --rm bem /data/BoreholeData/<folder> --to api
  # Compose starts the model server and pulls the model first.
  ollama:
    profiles: ["bem"]
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      BEM_MODEL_NAME: ${BEM_MODEL_NAME:-qwen3.5:2b}
    # Start the server, pull the model into the volume (a no-op once cached), then keep serving.
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$BEM_MODEL_NAME"
        wait
    volumes:
      - ollama_models:/root/.ollama
    # CPU by default. For an NVIDIA GPU, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      # Healthy only once the model has been pulled
      test: ["CMD-SHELL", "ollama show \"$$BEM_MODEL_NAME\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 360

  bem:
    profiles: ["bem"]
    build: ./bem
    depends_on:
      api:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      BEM_API_URL: http://api:4000/api
      BEM_MODEL_BASE_URL: ${BEM_MODEL_BASE_URL:-http://ollama:11434/v1}
      BEM_MODEL_NAME: ${BEM_MODEL_NAME:-qwen3.5:2b}
    command: ["--help"]
    volumes:
      # Confidential sample data, mounted read-only and never baked into the image
      - ./data:/data:ro
      - ./bem/out:/app/out
      - ./bem/output:/app/output

  # HTTP endpoint of the pipeline: the API posts uploaded documents to it (PIPELINE_URL above).
  pipeline:
    profiles: ["bem"]
    build: ./bem
    restart: unless-stopped
    entrypoint: ["bem-serve"]
    command: []
    depends_on:
      api:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      BEM_API_URL: http://api:4000/api
      BEM_MODEL_BASE_URL: ${BEM_MODEL_BASE_URL:-http://ollama:11434/v1}
      BEM_MODEL_NAME: ${BEM_MODEL_NAME:-qwen3.5:2b}

volumes:
  db_data:
  document_storage:
  ollama_models:
