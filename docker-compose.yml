services:
  db:
    # Multi-arch (amd64 + arm64) fork of postgis/postgis, which only ships amd64 images.
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-api_dev}
    # Kept for local development (mix phx.server on the host); not needed by the other services.
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db/${POSTGRES_DB:-api_dev}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env (see .env.example)}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_PUBLIC_PORT: ${API_PORT:-4000}
      PHX_PUBLIC_SCHEME: http
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      # Source documents of the boreholes (confidential, never baked into the image)
      - document_storage:/data/storage

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db_data:
  document_storage:
