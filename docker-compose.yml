services:
  db:
    # Multi-arch (amd64 + arm64) fork of postgis/postgis, which only ships amd64 images.
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-api_prod}
    # Kept for local development (mix phx.server on the host); not needed by the other services.
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db/${POSTGRES_DB:-api_prod}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env (see .env.example)}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_PUBLIC_PORT: ${API_PORT:-4001}
      PHX_PUBLIC_SCHEME: http
      SEED_MOCK_DATA: ${SEED_MOCK_DATA:-false}
      MOCK_BOREHOLES: ${MOCK_BOREHOLES:-1000}
      # Where uploaded documents are sent for extraction. Empty: uploads are stored but not processed.
      PIPELINE_URL: ${PIPELINE_URL-http://pipeline:8000/execute}
    ports:
      - "${API_PORT:-4001}:4000"
    volumes:
      # Source documents of the boreholes (confidential, never baked into the image)
      - document_storage:/data/storage

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the build (web/Dockerfile, vite.config.ts `paths.origin`): without the real
        # origin, SvelteKit's CSRF check rejects every upload as a cross-site form submission.
        ORIGIN: http://${PHX_HOST:-localhost}:${WEB_PORT:-3001}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:4000
      # adapter-node's default is 512KB; match the API's own multipart limit (endpoint.ex) so the
      # proxy in hooks.server.ts doesn't reject uploads before they ever reach it.
      BODY_SIZE_LIMIT: 100M
    ports:
      - "${WEB_PORT:-3001}:3000"

  pipeline:
    # BEM extraction pipeline (FastAPI, POST /execute); the API sends uploaded documents here.
    build:
      context: .
      dockerfile: bem/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BEM_API_URL: http://api:4000
      BEM_ENV: ${BEM_ENV:-prod}
      # Auth for the `claude` CLI: either an API key or a token from `claude setup-token`
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      - "${BEM_PORT:-8000}:8000"

volumes:
  db_data:
  document_storage:
