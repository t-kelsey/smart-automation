[project]
name = "bem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kai Malaka", email = "km324@email.uni-freiburg.de" }
]
requires-python = ">=3.14"
dependencies = [
    "docling[easyocr]>=2.140.0",
    "langdetect>=1.0.9",
    "openai>=3.33.0",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pip>=26.2.1",
    "pydantic>=2.14.1",
    "pypdf>=6.21.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "requests>=2.34.2",
    "sentencepiece>=0.2.2",
    "transformers>=5.20.1",
]

[project.scripts]
bem = "bem.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
