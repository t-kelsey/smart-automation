# Extraction settings. CLI flags (--model, --base-url, --prompt-file) override these.

[model]
name = "qwen3.5:2b"
base_url = "http://localhost:11434/v1"   # Ollama; vLLM is usually http://localhost:8000/v1
api_key = "EMPTY"
temperature = 0
enable_thinking = false                   # Qwen3 hybrid models only; other models ignore it
max_retries = 2

[prompt]
file = "system_prompt.md"                 # relative to this folder
